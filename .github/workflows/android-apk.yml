name: Build Android APK

on:
  push:
    branches: [android-apk]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # needed only to attach the APK to a published release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk fight-karo-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fight-karo-debug-apk
          path: fight-karo-debug.apk
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" fight-karo-debug.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
